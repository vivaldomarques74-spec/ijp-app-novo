buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Atualizado de 8.2.1 para 8.9.1
        classpath 'com.android.tools.build:gradle:8.9.1'
        
        // Plugin do Google Services (necessário para o Push Notification)
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}